  <!-- Post-processing toggles (top-right) -->
  <div id="pp-toggles" class="panel-collapsible collapsed" data-panel-id="pp-toggles">
    <div class="compact pp-header-row">
      <span class="pp-header-label">顯示</span>
      <span class="panel-divider" aria-hidden="true"></span>
      <button class="panel-collapse-btn pp-collapse-btn" data-collapse-target="pp-toggles" title="收合面板">&#x25C0;</button>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="hud-toggle" title="情報 HUD（H）">
        <span class="pp-icon">&#x25CE;</span>
        <span class="pp-label">HUD</span>
      </button>
      <div class="pp-slider-row" id="hud-layout-row">
        <span class="pp-slider-mini-label">版面</span>
        <select id="hud-layout-select" class="pp-select" aria-label="HUD 版面">
          <option value="tactical">戰術</option>
          <option value="operator">操作員</option>
          <option value="minimal">極簡</option>
        </select>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="detection-toggle" title="偵測疊層（D）" aria-label="偵測疊層" aria-pressed="false">
        <span class="pp-icon">&#x25A3;</span>
        <span class="pp-label">偵測</span>
      </button>
      <div class="pp-slider-row detection-slider-row" id="detection-slider-row">
        <label class="pp-slider-mini-label" for="detection-density-slider">密度</label>
        <input type="range" class="pp-slider" id="detection-density-slider" min="0" max="100" step="25" value="50" aria-label="偵測標籤密度" />
        <span class="pp-slider-value" id="detection-density-value">50%</span>
      </div>
      <div class="pp-slider-row detection-allocation-row" id="detection-allocation-row">
        <span class="pp-slider-mini-label">配置方式</span>
        <div class="pp-mode-seg detection-allocation-seg" role="radiogroup" aria-label="偵測標籤配置方式">
          <button class="pp-mode-btn active" id="detection-allocation-elastic" data-allocation="ELASTIC" role="radio" aria-checked="true">彈性</button>
          <button class="pp-mode-btn" id="detection-allocation-weighted" data-allocation="WEIGHTED" role="radio" aria-checked="false">加權</button>
        </div>
      </div>
      <div class="pp-slider-row detection-fade-row" id="detection-fade-row">
        <label class="pp-slider-mini-label" for="detection-fade-slider">淡出</label>
        <input type="range" class="pp-slider" id="detection-fade-slider" min="0" max="40" step="1" value="7" aria-label="偵測淡出距離" title="鏡頭遮罩外的世界疊層淡出距離，以遮罩半徑百分比表示" />
        <span class="pp-slider-value" id="detection-fade-value">7%</span>
      </div>
      <div class="pp-slider-row detection-opacity-row" id="detection-opacity-row">
        <label class="pp-slider-mini-label" for="detection-opacity-slider">外部</label>
        <input type="range" class="pp-slider" id="detection-opacity-slider" min="0" max="100" step="1" value="1" aria-label="鏡頭遮罩外的偵測不透明度" title="超出淡出距離的世界疊層標籤與卡片不透明度" />
        <span class="pp-slider-value" id="detection-opacity-value">1%</span>
      </div>
    </div>
    <!-- The one shared preset-parameter surface is inserted here at runtime. -->
    <div id="param-slider-panel">
      <div class="param-panel-header">
        <span class="param-panel-title">參數</span>
        <span class="param-panel-divider"></span>
        <button class="panel-collapse-btn" id="param-panel-collapse-btn" data-collapse-target="param-slider-panel" title="收合面板">−</button>
      </div>
      <div id="param-sliders"></div>
    </div>
    <div class="pp-toggle-group">
      <!-- 3D aircraft is DEFAULT-ON in Proximity (owner directive 2026-08-22), so the
           button ships lit and the mode row ships open — the same markup-carries-the-default
           convention as #scope-toggle. ui.js re-syncs both from durable layer state, which
           is what flips them back for a share link or a stored session carrying 3D off. -->
      <button class="pp-toggle-btn active" id="models3d-toggle" aria-pressed="true" title="3D 飛機模型 — 拉遠時顯示平面圖示，靠近時顯示 3D 模型">
        <span class="pp-icon">&#x2708;</span>
        <span class="pp-label">3D</span>
      </button>
      <div class="pp-slider-row visible" id="models3d-mode-row">
        <span class="pp-slider-mini-label">模型範圍</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="3D 模型覆蓋範圍">
          <button class="pp-mode-btn active" id="models3d-mode-proximity" data-mode="proximity" role="radio" aria-checked="true">鄰近</button>
          <button class="pp-mode-btn" id="models3d-mode-all" data-mode="all" role="radio" aria-checked="false">全部</button>
        </div>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn active" id="scope-toggle" title="鏡頭遮罩 — 圓形視窗遮罩" aria-pressed="true">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">adjust</span>
        <span class="pp-label">鏡頭遮罩</span>
      </button>
      <div class="pp-slider-row visible" id="scope-slider-row">
        <span class="pp-slider-mini-label">羽化</span>
        <!-- Feather starts at an 11% soft scope-mask edge (owner final lock
             2026-08-24, superseding the 08-22 hard-crop and 08-23 8% rulings);
             mirrors SCOPE_FEATHER_RATIO_DEFAULT in src/scopeMask.js. Feather
             softens the black mask edge; label fading is the separate Fade
             slider. -->
        <input type="range" class="pp-slider" id="scope-feather-slider" min="0" max="100" value="11" aria-label="鏡頭遮罩邊緣羽化" title="鏡頭遮罩邊緣羽化程度，以遮罩半徑百分比表示" />
        <span class="pp-slider-value" id="scope-feather-value">11%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="draw-toggle" title="在世界上繪製 — 點擊頂點，雙擊或按 Enter 完成，按 Esc 取消" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">draw</span>
        <span class="pp-label">繪製</span>
      </button>
      <div class="pp-slider-row" id="draw-mode-row">
        <span class="pp-slider-mini-label">形狀</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="欲繪製的形狀">
          <button class="pp-mode-btn active" data-shape="area" role="radio" aria-checked="true">區域</button>
          <button class="pp-mode-btn" data-shape="line" role="radio" aria-checked="false">線段</button>
          <button class="pp-mode-btn" data-shape="pin" role="radio" aria-checked="false">標記點</button>
        </div>
      </div>
      <div class="pp-slider-row" id="draw-label-row">
        <input type="text" class="pp-text-input" id="draw-label-input" maxlength="120" placeholder="標籤（選填）" aria-label="所繪形狀的標籤" autocomplete="off" spellcheck="false">
        <select class="pp-select draw-color-select" id="draw-color-select" aria-label="所繪形狀的顏色">
          <option value="primary">主色</option>
          <option value="amber">琥珀</option>
          <option value="cyan">青色</option>
          <option value="green">綠色</option>
          <option value="red">紅色</option>
        </select>
        <button class="pp-mode-btn draw-clear-btn" id="draw-clear" type="button" title="清除畫板上所有標記">清除</button>
        <span class="draw-hint" id="draw-hint" aria-live="polite"></span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="celestial-toggle" title="天體環 — 顯示完整地球" aria-pressed="false">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">flare</span>
        <span class="pp-label">天體環</span>
      </button>
    </div>
    <button class="pp-toggle-btn" id="clean-view-toggle" title="隱藏 UI 介面元素">
      <span class="pp-icon">&#x25A1;</span>
      <span class="pp-label">簡潔畫面</span>
    </button>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="bloom-toggle" title="光暈 / 泛光">
        <span class="pp-icon">&#x2728;</span>
        <span class="pp-label">光暈</span>
      </button>
      <div class="pp-slider-row" id="bloom-slider-row">
        <input type="range" class="pp-slider" id="bloom-intensity-slider" min="0" max="200" value="0" aria-label="光暈強度" />
        <span class="pp-slider-value" id="bloom-intensity-value">0%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="sharpen-toggle" title="銳化">
        <span class="pp-icon">&#x1F50D;</span>
        <span class="pp-label">銳化</span>
      </button>
      <div class="pp-slider-row" id="sharpen-slider-row">
        <input type="range" class="pp-slider" id="sharpen-intensity-slider" min="0" max="100" value="49" aria-label="銳化強度" />
        <span class="pp-slider-value" id="sharpen-intensity-value">49%</span>
      </div>
    </div>
  </div>
  <button id="clean-view-exit" title="返回 UI 控制項">結束簡潔畫面</button>
