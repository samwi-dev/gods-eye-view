  <!-- Unified bottom command dock: locations, voice (injected at runtime), visual presets -->
  <div id="command-dock" aria-label="導航、語音與視覺風格控制">
  <!-- Control panel -->
  <div id="control-panel" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="panel-inner">
      <button id="control-panel-toggle" class="panel-header dock-tray-toggle" type="button"
        data-dock-toggle-target="control-panel" aria-expanded="false"
        aria-controls="control-panel-popover" aria-label="展開視覺風格">
        <span class="panel-title"><span class="dock-label-icon dock-label-icon-presets" aria-hidden="true"></span>視覺風格</span>
        <span class="panel-divider"></span>
      </button>
      <div id="control-panel-popover" class="dock-popover-content">
      <button class="dock-pin-btn" data-pin-target="control-panel" type="button" aria-label="釘選視覺風格" aria-pressed="false" title="保持視覺風格面板展開"><img src="/pin.svg" alt="" /></button>
      <div id="style-buttons" class="button-grid">
        <button class="style-btn active" data-style="normal" title="以無濾鏡的原始畫面顯示地球。">
          <span class="btn-icon">◯</span>
          <span class="btn-label">一般</span>
          <span class="btn-key">1</span>
        </button>
        <button class="style-btn" data-style="retro" title="模擬帶有掃描線與螢幕曲率的綠色磷光 CRT 顯示器。">
          <span class="btn-icon">▦</span>
          <span class="btn-label">CRT</span>
          <span class="btn-key">2</span>
        </button>
        <button class="style-btn" data-style="surveillance" title="模擬夜視鏡效果，具備綠色增強與管狀暈影。">
          <span class="btn-icon">🌙</span>
          <span class="btn-label">夜視</span>
          <span class="btn-key">3</span>
        </button>
        <button class="style-btn" data-style="thermal" title="模擬 FLIR 式熱成像對比。調高 Ironbow 可顯示色彩。">
          <span class="btn-icon">🌡️</span>
          <span class="btn-label">熱成像</span>
          <span class="btn-key">4</span>
        </button>
        <button class="style-btn" data-style="anime" title="套用明亮的動畫式賽璐璐上色與插畫描邊。">
          <span class="btn-icon">✦</span>
          <span class="btn-label">動畫</span>
          <span class="btn-key">5</span>
        </button>
        <button class="style-btn" data-style="noir" title="套用高對比黑白電影黑色風格分級。">
          <span class="btn-icon">◐</span>
          <span class="btn-label">黑色電影</span>
          <span class="btn-key">6</span>
        </button>
        <button class="style-btn" data-style="snow" title="為場景加上寒冷、白雪皚皚的效果。">
          <span class="btn-icon">❄</span>
          <span class="btn-label">雪景</span>
          <span class="btn-key">7</span>
        </button>
      </div>
      <section class="map-source-section" aria-labelledby="map-source-label">
        <div class="map-source-heading">
          <span id="map-source-label">地圖來源</span>
          <span id="map-stack-status" class="pp-stack-status" aria-live="polite">3D</span>
        </div>
        <div id="map-stack-chips" class="map-stack-chip-row" role="group" aria-label="地圖來源"></div>
      </section>
      </div>
      <div id="style-mini-status" class="panel-mini-status" aria-live="polite">
        <span class="panel-mini-label">風格</span>
        <span id="style-mini-value" class="panel-mini-value">一般</span>
      </div>
    </div>
  </div>

  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" class="dock-tray-toggle" type="button" data-dock-toggle-target="location-bar" aria-controls="location-bar-popover" aria-expanded="false" aria-label="展開地點" title="展開地點">
          <span class="location-toolbar-label"><span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>地點</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" title="收合面板">+</button>
      </div>
      <div id="location-mini-status" class="location-mini-status" aria-live="polite">
        <div id="location-mini-city" class="location-mini-city">📍 地點：--</div>
        <div id="location-mini-poi" class="location-mini-poi">地標：--</div>
      </div>
      <div id="location-bar-popover" class="dock-popover-content">
        <button class="dock-pin-btn" data-pin-target="location-bar" type="button" aria-label="釘選地點面板" aria-pressed="false" title="保持地點面板展開"><img src="/pin.svg" alt="" /></button>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <div class="location-search-wrap">
            <button id="search-toggle" class="search-toggle-btn" title="搜尋任意地點">
              <span>&#x1F50E;</span>
            </button>
            <input type="text" id="location-search" placeholder="搜尋任意地點..." autocomplete="off" spellcheck="false" aria-label="依名稱或座標搜尋地點" />
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
