  <!-- Global Context is deliberately independent from the left layer accordion. -->
  <aside id="right-context-rail">
    <div id="global-context-panel" class="panel-collapsible collapsed" data-panel-id="global-context-panel">
      <div class="panel-glow"></div>
      <div class="global-context-panel-inner">
        <div class="panel-header">
          <span class="panel-title">情資</span>
          <span class="panel-divider"></span>
          <div id="context-radio-dock" class="context-radio-dock">
            <button id="context-radio-toggle-btn" class="context-radio-toggle" type="button" aria-expanded="false" aria-controls="context-radio-mini" aria-label="開啟精簡電台控制" title="開啟精簡電台控制">
              <span class="material-symbols-outlined" aria-hidden="true">radio</span>
            </button>
            <div id="context-radio-mini" class="context-radio-mini" role="group" aria-label="精簡電台控制" hidden>
              <div class="context-radio-mini-heading">
                <span>電台</span>
                <strong id="context-radio-mini-station">電台就緒</strong>
                <span class="context-radio-mini-actions">
                  <button id="context-radio-details-btn" type="button" aria-label="開啟詳細電台控制" aria-expanded="false" aria-controls="radio-panel" title="開啟詳細電台控制">
                    <span class="material-symbols-outlined" aria-hidden="true">open_in_full</span>
                  </button>
                  <button id="context-radio-mini-close-btn" type="button" aria-label="關閉精簡電台控制" title="關閉精簡電台控制">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                  </button>
                </span>
              </div>
              <button id="context-radio-mini-enable-btn" class="panel-layer-toggle" type="button" aria-pressed="false">啟用</button>
              <div class="context-radio-mini-transport">
                <button id="context-radio-mini-prev-btn" type="button" aria-label="上一個篩選電台" title="上一台" disabled>◀◀</button>
                <button id="context-radio-mini-play-btn" type="button" aria-label="播放所選電台" title="播放" disabled>▶</button>
                <button id="context-radio-mini-next-btn" type="button" aria-label="下一個篩選電台" title="下一台" disabled>▶▶</button>
              </div>
              <label class="context-radio-mini-volume" for="context-radio-mini-volume">
                <span>音量</span>
                <input id="context-radio-mini-volume" class="gev-quantitative-slider" type="range" min="0" max="100" value="80" aria-label="精簡電台音量" disabled />
                <output id="context-radio-mini-volume-value" class="gev-slider-value" for="context-radio-mini-volume">80%</output>
              </label>
            </div>
          </div>
          <button class="panel-collapse-btn" data-collapse-target="global-context-panel" title="展開面板">▶</button>
        </div>
        <div class="global-context-modes" role="tablist" aria-label="情資模式">
          <button id="global-context-flights-btn" class="context-mode-button" type="button" role="tab" tabindex="0" aria-selected="false" aria-controls="context-flights-view" aria-label="接觸目標" title="依你選擇的類型（飛機、船艦、設施）輪替顯示最近的接觸目標。衛星則獨立追蹤。">
            <span class="material-symbols-outlined" aria-hidden="true">radar</span>
            <span>接觸目標</span>
          </button>
          <button id="global-context-missions-btn" class="context-mode-button" type="button" role="tab" tabindex="0" aria-selected="false" aria-controls="context-missions-view">
            <span class="material-symbols-outlined" aria-hidden="true">rocket_launch</span>
            <span>太空任務</span>
          </button>
        </div>
        <div id="context-mode-standby" class="context-mode-standby">
          <strong>選擇情資模式</strong>
          <span>接觸目標 — 最近的飛機 · 船艦 · 設施<br>太空任務 — 發射任務與軌道資產</span>
        </div>
        <section id="context-flights-view" class="context-mode-view" role="tabpanel" aria-labelledby="global-context-flights-btn" hidden>
          <div class="global-context-actions" aria-label="接觸目標情資操作">
            <button id="cockpit-entry" type="button" hidden>
              <span class="material-symbols-outlined" aria-hidden="true">flight</span>
              <span>座艙視角</span>
            </button>
            <button id="installations-search-btn" class="panel-layer-toggle" type="button">搜尋鄰近設施</button>
            <button id="tr3b-toggle" class="tr3b-toggle" type="button" aria-pressed="false" hidden aria-label="將所追蹤接觸目標重新分類為 TR-3B" title="重新分類為 TR-3B">🛸</button>
          </div>
          <aside id="military-awareness-panel">
            <div class="military-awareness-standby">
              <strong>接觸目標情資已關閉</strong>
              <span>選擇接觸目標以載入觀測 / 標記鄰近態勢</span>
            </div>
          </aside>
        </section>
        <section id="context-missions-view" class="context-mode-view" role="tabpanel" aria-labelledby="global-context-missions-btn" hidden>
          <div id="space-mission-panel-host">
            <div id="space-mission-roster" class="space-mission-roster" aria-label="可用太空任務">
              <div class="space-mission-roster-header">
                <div>
                  <strong>可用任務</strong>
                  <span>選擇任務以檢視詳情</span>
                </div>
                <output data-mission-roster-count>—</output>
              </div>
              <div class="space-mission-roster-list" data-mission-roster-list>
                <div class="space-mission-roster-empty">正在載入 30 天任務索引</div>
              </div>
              <p class="space-mission-roster-focus-continuation" tabindex="-1" data-mission-roster-focus-continuation>TAB 預覽 · ENTER / SPACE 選取</p>
            </div>
          </div>
        </section>
        <section id="radio-panel" class="panel-collapsible collapsed" data-panel-id="radio-panel" aria-label="網路電台伴唱">
          <div class="radio-panel-inner">
            <div class="panel-header">
              <span class="panel-title">電台</span>
              <span id="radio-layer-state" class="radio-layer-state">關閉</span>
              <span class="panel-divider"></span>
              <button class="panel-collapse-btn" data-collapse-target="radio-panel" title="展開電台" aria-label="展開電台區塊">+</button>
            </div>
            <div class="radio-directory-row">
              <button id="radio-enable-btn" class="panel-layer-toggle" type="button" aria-pressed="false">啟用</button>
              <label class="radio-filter-label" for="radio-filter">電台標籤</label>
              <select id="radio-filter" aria-label="依電台標籤篩選" disabled>
                <option value="all">全部</option>
              </select>
            </div>
            <div id="radio-station-card" class="radio-station-card" aria-live="polite">
              <strong id="radio-station-name">尚未選擇電台</strong>
              <span id="radio-station-meta">啟用電台後，選擇地球上的標記或按下一台。</span>
              <span id="radio-station-tags"></span>
            </div>
            <div id="radio-tuner" class="radio-tuner" hidden>
              <div class="radio-tuner-header">
                <span id="radio-tuner-band-label">電台目錄頻段</span>
                <output id="radio-tuner-value" for="radio-tuner-slider">拖曳以調頻</output>
              </div>
              <div class="radio-tuner-dial">
                <div class="radio-tuner-scale" aria-hidden="true"></div>
                <div id="radio-tuner-needle" class="radio-tuner-needle" aria-hidden="true"></div>
                <input id="radio-tuner-slider" type="range" min="0" max="0" step="1" value="0"
                  aria-label="調整可用的網路電台" aria-valuetext="沒有可用電台" disabled />
              </div>
              <div class="radio-tuner-readout">
                <span id="radio-tuner-station">全部 · 拖曳指針</span>
                <span>會自動吸附至可用電台</span>
              </div>
            </div>
            <div class="radio-transport" role="group" aria-label="電台播放">
              <button id="radio-prev-btn" type="button" aria-label="上一個篩選電台" disabled>上一台</button>
              <button id="radio-play-btn" type="button" aria-label="播放所選電台" disabled>播放</button>
              <button id="radio-next-btn" type="button" aria-label="下一個篩選電台" disabled>下一台</button>
              <button id="radio-stop-btn" type="button" aria-label="停止電台播放" disabled>停止</button>
            </div>
            <label class="radio-volume-row" for="radio-volume">
              <span>音量</span>
              <input id="radio-volume" class="gev-quantitative-slider" type="range" min="0" max="100" value="80" aria-label="電台音量" />
              <output id="radio-volume-value" class="gev-slider-value" for="radio-volume">80%</output>
            </label>
            <div id="radio-playback-state" class="radio-playback-state" role="status" aria-live="polite">電台已關閉</div>
            <div class="radio-links">
              <a id="radio-station-homepage" href="#" target="_blank" rel="noopener noreferrer" hidden>電台網站</a>
              <a href="https://www.radio-browser.info/" target="_blank" rel="noopener noreferrer">目錄來源：RADIO BROWSER</a>
            </div>
            <p class="radio-privacy">按下播放後，音訊會直接連線至該廣播來源，你的 IP 位址將對該廣播來源可見。</p>
          </div>
        </section>
      </div>
    </div>
  </aside>

  <div id="scene-runtime"></div>
