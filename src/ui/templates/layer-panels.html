  <div id="left-panel-stack">
  <!-- Data Layer Toggle Panel -->
  <div id="data-panel" class="panel-collapsible collapsed active" data-panel-id="data-panel">
    <div class="panel-glow"></div>
    <div class="data-panel-inner">
      <div class="panel-header">
        <span class="panel-title">資料圖層</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="data-panel" title="收合面板">+</button>
      </div>
      <div id="data-toggles" class="data-toggle-list"></div>
    </div>
  </div>

  <!-- CCTV Coverage Panel -->
  <div id="cctv-panel" class="panel-collapsible collapsed" data-panel-id="cctv-panel">
    <div class="panel-glow"></div>
    <div class="cctv-panel-inner">
      <div class="panel-header">
        <span class="panel-title">CCTV</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="cctv-panel" title="收合面板">+</button>
      </div>
      <div id="cctv-frame-wrap" class="cctv-frame-wrap">
        <img id="cctv-frame" alt="CCTV 畫面影格" />
      </div>
      <div id="cctv-source-badge" role="status" aria-live="polite">來源 · 未知</div>
      <div id="cctv-meta">啟用 CCTV 以載入攝影機路口資料</div>
      <div class="cctv-controls">
        <button id="cctv-enable-btn" class="scene-btn">CCTV 關閉</button>
        <button id="cctv-nearest-btn" class="scene-btn">最近</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-prev-btn" class="scene-btn">上一個</button>
        <select id="cctv-camera-select" aria-label="CCTV 攝影機"></select>
        <button id="cctv-next-btn" class="scene-btn">下一個</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-focus-btn" class="scene-btn">聚焦</button>
        <button id="cctv-coverage-btn" class="scene-btn">覆蓋範圍：關閉</button>
        <button id="cctv-auto-hop-btn" class="scene-btn">自動切換：關閉</button>
      </div>
      <div class="cctv-controls">
        <button id="cctv-projection-btn" class="scene-btn">投影：開啟</button>
        <span id="cctv-quality-chip">校正 · --</span>
      </div>
      <div class="cctv-calibration-block">
        <div class="cctv-calibration-header">
          <div class="cctv-summary-label">校正</div>
          <button id="cctv-adjust-btn" class="scene-btn" title="在世界中拖曳攝影機：環會旋轉、箭頭會移動、控制點可設定範圍/視角">調整</button>
        </div>
        <div id="cctv-cal-readout" class="cctv-cal-readout" aria-label="攝影機姿態 — 點擊數值可輸入">
          <button class="cctv-cal-value" data-cal-field="heading" title="方位角（羅盤 °）— 點擊輸入">方位 --</button>
          <button class="cctv-cal-value" data-cal-field="pitch" title="俯仰角（° 上/下）— 點擊輸入">俯仰 --</button>
          <button class="cctv-cal-value" data-cal-field="fov" title="水平視角（°）— 點擊輸入">視角 --</button>
          <button class="cctv-cal-value" data-cal-field="range" title="範圍 / 監視平面距離（公尺）— 點擊輸入">範圍 --</button>
          <button class="cctv-cal-value" data-cal-field="height" title="架設高度（公尺）— 點擊輸入">高度 --</button>
          <button class="cctv-cal-value" data-cal-field="north" title="與目錄位置的北向偏移（公尺）— 點擊輸入">ΔN --</button>
          <button class="cctv-cal-value" data-cal-field="east" title="與目錄位置的東向偏移（公尺）— 點擊輸入">ΔE --</button>
        </div>
        <div class="cctv-controls cctv-calibration-actions">
          <button id="cctv-calib-save-btn" class="scene-btn">儲存校正</button>
          <button id="cctv-calib-reset-btn" class="scene-btn">重設校正</button>
        </div>
      </div>
      <div class="cctv-summary-label">場景摘要</div>
      <div id="cctv-summary">啟用 CCTV 以開始攝影機連動的情報摘要。</div>
    </div>
  </div>

  <!-- Scene Director Panel -->
  <div id="scene-panel" class="panel-collapsible collapsed" data-panel-id="scene-panel">
    <div class="panel-glow"></div>
    <div class="scene-panel-inner">
      <div class="panel-header">
        <span class="panel-title">場景</span>
        <span class="panel-divider"></span>
        <button class="panel-collapse-btn" data-collapse-target="scene-panel" title="收合面板">+</button>
      </div>
      <div class="scene-controls">
        <select id="scene-select" aria-label="場景腳本"></select>
        <button id="scene-new-btn" class="scene-btn">新增</button>
        <button id="scene-delete-btn" class="scene-btn scene-btn-danger">刪除</button>
      </div>
      <div class="scene-controls">
        <button id="scene-capture-btn" class="scene-btn">擷取鏡頭</button>
        <button id="scene-update-shot-btn" class="scene-btn">更新鏡頭</button>
      </div>
      <div id="scene-shot-list" class="scene-shot-list"></div>
      <div class="scene-controls">
        <button id="scene-start-btn" class="scene-btn">開始</button>
        <button id="scene-stop-btn" class="scene-btn scene-btn-danger">停止</button>
        <button id="scene-next-btn" class="scene-btn">下一個</button>
      </div>
      <div class="scene-controls">
        <button id="scene-export-btn" class="scene-btn">匯出預設</button>
        <button id="scene-import-btn" class="scene-btn">匯入</button>
        <button id="scene-download-btn" class="scene-btn">執行紀錄</button>
        <input type="file" id="scene-import-file" accept="application/json,.json" hidden />
      </div>
      <div class="scene-progress">
        <div id="scene-progress-fill">0%</div>
      </div>
      <div id="scene-status">就緒</div>
    </div>
  </div>

  </div>
